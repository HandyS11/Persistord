name: SonarQube Analysis

permissions:
  contents: read

# Analyze only the long-lived branch. Community-Edition Sonar has no branch/PR
# support — every analysis writes to the single main branch. PR build/test feedback
# is covered by CI.yml.
on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The scanner needs Java 21: SonarQube Server 2026.4 and SonarQube Cloud removed
      # Java 17 support, and an analysis started on 17 fails.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # actions/cache never overwrites an existing key, so a fixed key kept the plugins of
      # the first run forever: after a server upgrade every run downloaded the new ones
      # again and nothing saved them. Keying on the server version saves a fresh cache
      # once per upgrade, and restore-keys seeds it with the previous version's plugins.
      - name: Resolve SonarQube server version
        id: sonar-server
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          VERSION=$(curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" "${SONAR_HOST_URL%/}/api/server/version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ steps.sonar-server.outputs.version }}
          restore-keys: ${{ runner.os }}-sonar-

      # Not cached: a cache under a fixed key would pin the scanner to the first version
      # ever installed, for the same reason as above.
      - name: Install SonarQube scanner
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Build and analyze
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"${{ secrets.SONAR_PROJECT_KEY }}" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" /d:sonar.exclusions="**/samples/**" /d:sonar.coverage.exclusions="**/samples/**,**/tests/**,docs/**" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          dotnet build
          dotnet test --no-build --collect:"XPlat Code Coverage;Format=opencover" --logger "junit;LogFilePath=$GITHUB_WORKSPACE/test-results/{assembly}.junit.xml" --blame-hang-timeout 60s
          ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: ./test-results/*.junit.xml
          disable_search: true
