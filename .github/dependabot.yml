# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for every NuGet update instead of one per package.
      nuget:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
    ignore:
      # These are the minimum EF Core versions our published packages declare, not the
      # versions we test against. Raising them forces every consumer onto a newer EF and
      # breaks anyone pinned lower (CS1705), so they must only ever move as a deliberate,
      # documented decision. Latest-EF coverage still happens automatically: test and
      # sample projects reference Sqlite/Npgsql, which Dependabot does update and which
      # pull EF Core in transitively at their own version.
      - dependency-name: "Microsoft.EntityFrameworkCore"
      - dependency-name: "Microsoft.EntityFrameworkCore.Relational"
      # Published floor for Persistord.Protection, not a tested version — see the
      # shipped-floors comment in Directory.Packages.props.
      - dependency-name: "Microsoft.AspNetCore.DataProtection.Abstractions"
      # Published floor for Persistord.Adapters.NetCord, not a tested version — see the
      # shipped-floors comment in Directory.Packages.props. NetCord's current version is
      # already a prerelease, so leaving this unignored would let Dependabot offer
      # prerelease bumps and silently raise the published floor.
      - dependency-name: "NetCord"
      # Published floor for Persistord.Adapters.DSharpPlus, not a tested version — see
      # the shipped-floors comment in Directory.Packages.props. DSharpPlus's highest
      # SemVer version on NuGet (5.0.0) is unlisted and its v5 line is prerelease-only,
      # so an automated bump would either fail to restore or silently move the published
      # floor onto the in-progress rewrite.
      - dependency-name: "DSharpPlus"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR for every GitHub Actions update instead of one per action.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"
